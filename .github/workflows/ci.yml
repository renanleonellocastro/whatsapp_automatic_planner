name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint + format check)  # TST-07
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy (strict types)  # TST-07
        run: mypy
      - name: Pytest + 100% coverage gate  # TST-01
        run: pytest --cov
