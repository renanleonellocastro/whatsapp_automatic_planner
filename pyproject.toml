[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wapp-planner"
version = "0.1.0"
description = "WhatsApp Service Planner Automation — ingest WhatsApp job requests, classify intent, generate quotes/execution plans via LLM, deliver with human-in-the-loop approval."
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "rcastro", email = "rcastro@xchangealpha.com" }]
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27",
    "jinja2>=3",
    "python-docx>=1.1",
    "reportlab>=4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
filterwarnings = [
    # Starlette's TestClient emits this from inside the library, not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
branch = true
source = ["wapp_planner"]
# The process entrypoint wires real clients + runs the server; it is pragma'd
# internally and excluded here (its wiring, build_app, is tested with fakes).
omit = ["*/__main__.py"]

[tool.coverage.report]
# TST-01: 100% line + branch coverage of application code.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["wapp_planner"]

# These ship no type stubs; treat their imports as untyped.
[[tool.mypy.overrides]]
module = ["reportlab.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
